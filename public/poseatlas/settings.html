<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>设置 · 临智AI</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/home.css?v=1.8.394">
<link rel="stylesheet" href="assets/css/glass.css?v=1.8.394">
<style>
  .settings-group { margin-bottom: 16px; }
  .settings-group__title {
    font-size: 13px; font-weight: 700; color: var(--ink-soft);
    letter-spacing: .04em; margin-bottom: 10px;
    display: flex; align-items: center; gap: 6px;
  }
  .settings-row {
    display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end;
  }
  .settings-row .field { flex: 1 1 160px; margin-bottom: 0; }
  .saved-tip {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--success); opacity: 0;
    transition: opacity .2s;
  }
  .saved-tip.show { opacity: 1; }
  .provider-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  @media (max-width: 520px) { .provider-cards { grid-template-columns: repeat(2, 1fr); } }
  .provider-card {
    border: 1px solid var(--glass-border); border-radius: 12px;
    background: var(--glass-bg); color: var(--ink);
    padding: 10px 8px; text-align: center; cursor: pointer;
    font-size: 13px; font-weight: 600;
    transition: all .15s;
  }
  .provider-card:hover { border-color: var(--accent); }
  .provider-card.active {
    background: linear-gradient(135deg, rgba(255,255,255,.92), rgba(200,208,218,.85));
    color: #1f2328; border-color: rgba(255,255,255,.6);
  }
  .provider-card small { display: block; font-size: 10.5px; opacity: .7; font-weight: 400; margin-top: 2px; }
</style>
</head>
<body>

  <header class="topbar">
    <div class="topbar__inner">
      <a class="brand" href="index.html">
        <span class="brand__logo">🧭</span>
        <span class="brand__name">临智AI</span>
      </a>
      <nav class="topnav">
      <a href="index.html"><span class="nav-ico">🏠</span> 首页</a>
      <a href="home.html"><span class="nav-ico">🎨</span> 试装</a>
      <a href="collect.html"><span class="nav-ico">👗</span> 收集</a>
      <a href="batch.html"><span class="nav-ico">📦</span> 批量</a>
      <a href="pose.html"><span class="nav-ico">🧍</span> 姿鉴</a>
      <a href="costume.html"><span class="nav-ico">👚</span> 衣鉴</a>
      <a href="settings.html" class="active"><span class="nav-ico">⚙</span> 设置</a>
      </nav>
    </div>
  </header>

<main class="main workbench-main">
  <div class="panel">
    <div class="panel__head">
      <h2><span class="step">1</span> API 提供商</h2>
      <span class="saved-tip" id="savedTip">✓ 已保存</span>
    </div>

    <div class="provider-cards" id="providerCards"></div>

    <div class="settings-group" style="margin-top:14px;">
      <div class="settings-row">
        <div class="field">
          <label for="apiBase">API Base URL</label>
          <input id="apiBase" type="text" placeholder="https://..." spellcheck="false">
        </div>
        <div class="field">
          <label for="model">模型名称</label>
          <input id="model" type="text" spellcheck="false" list="modelList" autocomplete="off">
          <datalist id="modelList"></datalist>
        </div>
      </div>
      <div class="settings-row" style="margin-top:10px;">
        <div class="field">
          <label for="apiKey">API Key</label>
          <div class="key-input-wrap">
            <input id="apiKey" type="text" placeholder="sk-...（明文显示，可直接长按粘贴）" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off">
            <button type="button" class="btn btn--ghost btn--sm" id="btnTestKey" title="先保存，再向上游验证这个 Key 能不能用">🧪 测试保存</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="panel__head">
      <h2><span class="step">2</span> 生成参数</h2>
    </div>

    <div class="settings-row">
      <div class="field">
        <label for="size">尺寸</label>
        <!-- 选项由 model-presets.js 按当前模型生成，切模型自动换成该家支持的尺寸 -->
        <select id="size"></select>
      </div>
      <div class="field">
        <label for="outputFormat">输出格式</label>
        <select id="outputFormat">
          <option value="png">PNG</option>
          <option value="jpeg">JPEG</option>
          <option value="webp">WEBP</option>
        </select>
      </div>
    </div>

    <div class="settings-row" style="margin-top:12px;">
      <div class="field field--check">
        <label class="check">
          <input type="checkbox" id="watermark" checked>
          <span>关闭水印</span>
        </label>
        <label class="check">
          <input type="checkbox" id="promptExtend">
          <span>提示词润色</span>
        </label>
      </div>
    </div>

    <div class="settings-group" style="margin-top:12px;">
      <div class="settings-row">
        <div class="field">
          <label>生成方式</label>
          <div class="seg" id="modeSeg">
            <button type="button" data-mode="edit" class="active">人像参考生成</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="panel__head">
      <h2><span class="step">3</span> 点点 AI 助手</h2>
      <span class="saved-tip" id="llmTip"></span>
    </div>
    <div class="hint" style="margin-bottom:10px;">
      用于<strong>提示词优化</strong>与<strong>文件资产管理</strong>（自动命名 / 打标签 / 归类）。
      密钥<strong>只保存在服务器端</strong>，页面与接口都不会下发密钥内容，浏览器里查不到。
    </div>
    <div class="settings-row">
      <div class="field">
        <label>接入状态</label>
        <div id="llmStatus" class="hint">检测中…</div>
      </div>
    </div>
    <div class="settings-row" style="margin-top:10px;">
      <div class="field">
        <label>自定义 Key（可选，留空则用服务器内置）</label>
        <div class="key-input-wrap">
          <input id="llmKey" type="text" placeholder="ak_...（不填则使用服务器内置密钥）" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off">
          <button type="button" class="btn btn--ghost btn--sm" id="btnTestLlmKey" title="先保存，再发一个 1 token 的请求验证这个 Key">🧪 测试保存</button>
        </div>
      </div>
    </div>
  </div>

  <div class="panel panel--action">
    <button type="button" class="btn btn--primary" id="btnSave">💾 保存设置</button>
    <button type="button" class="btn btn--ghost" id="btnReset">↺ 恢复默认</button>
    <a class="btn btn--ghost" href="home.html">🎨 去生图工作台</a>
    <div class="status" id="status" role="status" aria-live="polite"></div>
  </div>
</main>

<script src="assets/js/model-presets.js?v=1.8.394"></script>
<script src="assets/js/api-client.js?v=1.8.394"></script>
<script type="module" src="assets/js/settings.js?v=1.8.394"></script>
<script src="assets/js/topbar-breath.js?v=1.8.394"></script>
<script src="assets/js/nav-lock.js?v=1.8.394"></script>
<script src="assets/js/qrcode-modal.js?v=1.8.394"></script>
<script src="assets/js/img-degrade.js?v=1.8.394"></script>
<script src="assets/js/no-url.js?v=1.8.394"></script>
</body>
</html>
