<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>临智AI · 工作台首页</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/home.css?v=1.8.394">
  <link rel="stylesheet" href="assets/css/glass.css?v=1.8.394">
  <style>
    /* ===== 首页专用：动态背景 ===== */
    .portal-bg {
      position: fixed;
      inset: 0;
      z-index: -2;
      overflow: hidden;
      pointer-events: none;
    }
    .portal-bg .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.5;
      will-change: transform;
      animation: portalFloat 16s ease-in-out infinite alternate;
    }
    .portal-bg .orb-1 {
      width: 340px; height: 340px;
      left: -60px; top: -40px;
      background: radial-gradient(circle, rgba(180,192,208,0.55), transparent 70%);
    }
    .portal-bg .orb-2 {
      width: 300px; height: 300px;
      right: -70px; top: 20%;
      background: radial-gradient(circle, rgba(140,155,175,0.5), transparent 70%);
      animation-delay: -5s;
    }
    .portal-bg .orb-3 {
      width: 380px; height: 380px;
      left: 8%; bottom: -90px;
      background: radial-gradient(circle, rgba(200,210,224,0.45), transparent 70%);
      animation-delay: -10s;
    }
    .portal-bg .orb-4 {
      width: 200px; height: 200px;
      right: 12%; bottom: 18%;
      background: radial-gradient(circle, rgba(165,178,196,0.4), transparent 70%);
      animation-delay: -7s;
    }
    @keyframes portalFloat {
      0%   { transform: translate(0, 0) scale(1); }
      50%  { transform: translate(30px, -26px) scale(1.08); }
      100% { transform: translate(-22px, 18px) scale(0.94); }
    }
    /* 漂浮微尘 */
    .portal-bg .dust {
      position: absolute;
      width: 4px; height: 4px;
      border-radius: 50%;
      background: rgba(255,255,255,0.35);
      animation: portalDust 9s linear infinite;
    }
    @keyframes portalDust {
      0%   { transform: translateY(0) translateX(0); opacity: 0; }
      12%  { opacity: 0.7; }
      88%  { opacity: 0.4; }
      100% { transform: translateY(-120px) translateX(40px); opacity: 0; }
    }

    /* ===== Hero ===== */
    .hero {
      text-align: center;
      padding: 18px 16px 6px;
      background: transparent;
      border-bottom: none;
    }
    .hero__logo { font-size: 26px; }
    .hero h1 { font-size: 20px; font-weight: 800; margin: 6px 0 4px; letter-spacing: 0.5px; }
    .hero p { color: var(--text-secondary); font-size: 13px; max-width: 560px; margin: 0 auto; }

    /* ===== 功能卡片 ===== */
    .cards {
      max-width: var(--page-max);
      margin: 18px auto;
      padding: 0 16px 40px;
      display: grid;
      grid-template-columns: repeat(3, 1fr); /* 三卡并排 */
      gap: 14px;
      align-items: stretch;
    }
    .cards .feature { width: 100%; min-height: 0; }
    @media (max-width: 860px) {
      .cards { grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 12px 32px; }
      .cards .feature--deduce { grid-column: 1 / -1; }
    }
    @media (max-width: 400px) {
      /* 保持两格平分，不降单列 */
      .cards { grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 8px 24px; }
      .cards .feature--deduce { grid-column: 1 / -1; }
      .feature { padding: 14px 8px; }
      .feature h2 { font-size: 15px; }
      .feature p { font-size: 11.5px; }
      .feature__icon { width: 46px; height: 46px; font-size: 22px; }
    }

    .feature {
      /* 略深一档的玻璃底：让动态粒子更突出，同时保证白色标题的对比度 */
      background: rgba(20, 24, 30, 0.34) !important;
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 20px 16px;
      text-decoration: none;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;      /* 图标居中 */
      text-align: center;        /* 文字居中 */
      gap: 10px;
      transition: transform 0.18s, box-shadow 0.18s, border-color 0.18s;
      position: relative;
      overflow: hidden;
      isolation: isolate;
    }
    .feature:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-lg);
      border-color: var(--primary);
    }

    /* ===== 卡片内动态背景层 ===== */
    .feature__fx {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: none;
      z-index: 0;
    }
    /* 内容浮在动态背景之上 */
    .feature > *:not(.feature__fx) { position: relative; z-index: 2; }

    /* 卡片内柔光呼吸 */
    .feature::before {
      content: "";
      position: absolute;
      inset: -35%;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(45% 45% at 32% 22%, rgba(205, 218, 234, 0.20), transparent 62%),
        radial-gradient(42% 42% at 72% 82%, rgba(150, 166, 188, 0.18), transparent 62%);
      animation: featureGlow 10s ease-in-out infinite alternate;
    }
    @keyframes featureGlow {
      from { transform: translate3d(-5%, -4%, 0) scale(1); opacity: .75; }
      to   { transform: translate3d(5%, 4%, 0) scale(1.16); opacity: 1; }
    }

    /* 鼠标跟随柔光（桌面端） */
    .feature::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      opacity: 0;
      transition: opacity .35s;
      background: radial-gradient(
        180px 140px at var(--mx, 50%) var(--my, 50%),
        rgba(220, 232, 248, 0.18),
        transparent 70%
      );
    }
    @media (hover: hover) and (pointer: fine) {
      .feature:hover::after { opacity: 1; }
    }

    .feature__icon {
      width: 56px; height: 56px;
      display: grid; place-items: center;
      border-radius: 50%;
      font-size: 26px;
      background: linear-gradient(135deg, var(--primary), #9aa4b2);
      color: #fff;
      box-shadow: inset 0 1px 2px rgba(255,255,255,0.5), 0 8px 18px rgba(0,0,0,0.35);
    }
    .feature h2 { font-size: 17px; font-weight: 700; text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5); }
    .feature p { color: var(--text-secondary); font-size: 12.5px; line-height: 1.6; margin: 0; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.42); }
    .feature__tag {
      margin-top: auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--primary);
      font-weight: 600;
      font-size: 13px;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.42);
    }

    /* 无障碍：用户开启"减少动态效果"时，关闭全部 CSS 动画 */
    @media (prefers-reduced-motion: reduce) {
      .feature::before,
      .portal-bg .orb { animation: none !important; }
      .feature::after { transition: none; }
      .feature:hover { transform: none; }
    }

    /* ===== 快捷入口（推演穿搭 / 姿鉴 / 衣鉴 辅助链接） ===== */
    .sublinks {
      max-width: 920px;
      margin: 0 auto 40px;
      padding: 0 16px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .sublinks a {
      font-size: 12.5px;
      color: var(--text-secondary);
      text-decoration: none;
      padding: 7px 14px;
      border: 1px solid var(--border);
      border-radius: 999px;
      transition: all 0.15s;
    }
    .sublinks a:hover { color: var(--primary); border-color: var(--primary); background: var(--primary-soft); }
  </style>
</head>
<body>
  <!-- 动态背景 -->
  <div class="portal-bg" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="orb orb-4"></div>
  </div>

  <header class="topbar">
    <div class="topbar__inner">
      <a class="brand" href="index.html">
        <span class="brand__logo">🧭</span>
        <span class="brand__name">临智AI</span>
      </a>
      <nav class="topnav">
      <a href="index.html" class="active"><span class="nav-ico">🏠</span> 首页</a>
      <a href="home.html"><span class="nav-ico">🎨</span> 试装</a>
      <a href="collect.html"><span class="nav-ico">👗</span> 收集</a>
      <a href="batch.html"><span class="nav-ico">📦</span> 批量</a>
      <a href="pose.html"><span class="nav-ico">🧍</span> 姿鉴</a>
      <a href="costume.html"><span class="nav-ico">👚</span> 衣鉴</a>
      <a href="settings.html"><span class="nav-ico">⚙</span> 设置</a>
      </nav>
    </div>
  </header>

  <section class="hero">
    <div class="hero__logo">🧭</div>
    <h1>AI 生图工作台</h1>
    <p>姿势图鉴 · 衣装图鉴 · 多 API 生图 · 去人留衣收集，一站式 AI 绘画参考与生产工具</p>
  </section>

  <main class="cards">
    <!-- 我要试装：人像 + 形体 + 服装 = 新图（三束光向中心汇聚） -->
    <a class="feature" href="home.html" data-fx="converge">
      <div class="feature__icon">🎨</div>
      <h2>我要试装</h2>
      <p>人像 + 形体 + 服装 = 新图</p>
      <span class="feature__tag">进入工作台 →</span>
    </a>

    <!-- 收集时装：收装你喜欢的服装存为公共资源（衣物环绕漂入衣橱） -->
    <a class="feature" href="collect.html" data-fx="orbit">
      <div class="feature__icon">👗</div>
      <h2>收集时装</h2>
      <p>收装你喜欢的服装存为公共资源</p>
      <span class="feature__tag">进入收集 →</span>
    </a>

    <!-- 推演穿搭：基于 AI 推演功能（神经网络连线推演） -->
    <a class="feature feature--deduce" href="home.html#deduce" data-fx="network">
      <div class="feature__icon">🧠</div>
      <h2>推演穿搭</h2>
      <p>输入身高、体重、短裙或长裤等简单喜好，AI 帮你推演出最适合的姿鉴与衣鉴组合</p>
      <span class="feature__tag">开始推演 →</span>
    </a>
  </main>

  <div class="sublinks">
    <a href="pose.html">🧍 姿势图鉴</a>
    <a href="costume.html">👚 衣装图鉴</a>
    <a href="batch.html">📦 批量收集</a>
  </div>

  <script src="assets/js/card-fx.js?v=1.8.394"></script>
  <script src="assets/js/topbar-breath.js?v=1.8.394"></script>
<script src="assets/js/nav-lock.js?v=1.8.394"></script>
<script src="assets/js/qrcode-modal.js?v=1.8.394"></script>

<script src="assets/js/no-url.js?v=1.8.394"></script>
</body>
</html>
